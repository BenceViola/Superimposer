name: Tests

on:
  push:
    branches: [main, prototype]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Install Chromium and WebKit for Playwright
        run: npx playwright install --with-deps chromium webkit
      - name: End-to-end tests (includes the single-file build)
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: superimposer-single-file
          path: dist/superimposer.html
